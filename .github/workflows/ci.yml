name: CI/CD

on:
  push:
    branches: [main, refactor]
    tags:
      - 'v*'
  pull_request:
    branches: [main, refactor]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: dart analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: animes_io-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  github-release:
    name: Publish Release APK
    needs: analyze-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/refactor' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: animes_io-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Animes IO - APK Release
          body: |
            ## 🎌 Animes IO - App Android (Release APK)

            Baixe o arquivo **`app-release.apk`** abaixo para instalar o aplicativo no seu dispositivo Android!

            - **Compilado com**: Flutter 3.38.5 / Dart 3.x
            - **Arquitetura**: Clean Architecture + BLoC
          files: app-release.apk
          prerelease: false
