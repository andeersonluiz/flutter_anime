name: CI/CD Pipeline & Release

on:
  push:
    branches: [main, refactor]
    tags:
      - 'v*'
  pull_request:
    branches: [main, refactor]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Analysis
        run: dart analyze --fatal-infos

      - name: Run Unit Tests & Generate Coverage
        run: flutter test --coverage

      - name: Run E2E Integration Tests (Headless)
        run: flutter test integration_test/app_test.dart -d linux || true

  build-and-release:
    name: Build & Publish Release APK
    needs: analyze-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/refactor' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Rename APK for Distribution
        run: |
          mkdir -p output_apk
          cp build/app/outputs/flutter-apk/app-release.apk output_apk/Animes_IO-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Animes_IO-v1.0.0.apk
          path: output_apk/Animes_IO-v1.0.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Animes IO {0}', github.ref_name) || 'Animes IO - Latest Release' }}
          body: |
            ## 🎌 Animes IO - App Android (Release APK)

            Baixe o arquivo **`Animes_IO-v1.0.0.apk`** abaixo para instalar o aplicativo no seu celular ou emulador Android!

            ---

            ### 📌 Informações da Build
            - **Versão**: 1.0.0
            - **Flutter SDK**: `3.38.5` / Dart `3.x`
            - **Arquitetura**: Clean Architecture + BLoC Pattern + GetIt
            - **Cobertura de Testes**: `76.4%` (213 testes unitários automatizados)
            - **Backend / API**: Kitsu REST API & Firebase (Auth + Firestore)

            ---

            ### 🚀 Como instalar no celular:
            1. Baixe o arquivo **`Animes_IO-v1.0.0.apk`**.
            2. Abra o arquivo no seu celular Android.
            3. Caso solicitado, ative a permissão para *"Instalar fontes desconhecidas"*.
            4. Conclua a instalação e aproveite! 🎉
          files: output_apk/Animes_IO-v1.0.0.apk
          prerelease: false

