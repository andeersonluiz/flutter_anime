name: CI/CD Pipeline & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test git_hooks.dart

      - name: Run Static Analysis
        run: dart analyze --fatal-infos

      - name: Run Unit Tests & Generate Coverage
        run: flutter test --coverage

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E Integration Tests (Android Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/app_test.dart --reporter=expanded

  build-and-release:
    name: Build & Publish Release APK
    needs: analyze-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Build Universal Release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Extract Version
        run: |
          APP_VERSION=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Rename APK for Distribution
        run: |
          mkdir -p output_apk
          cp build/app/outputs/flutter-apk/app-release.apk output_apk/Animes_IO-v${{ env.APP_VERSION }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Animes_IO-v${{ env.APP_VERSION }}.apk
          path: output_apk/Animes_IO-v${{ env.APP_VERSION }}.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: ${{ format('Animes IO v{0}', env.APP_VERSION) }}
          make_latest: true
          body: |
            ## 🎌 Animes IO - App Android (Release APK)

            Baixe o arquivo **`Animes_IO-v${{ env.APP_VERSION }}.apk`** abaixo para instalar o aplicativo no seu celular ou emulador Android!

            ---

            ### 📌 Informações da Build
            - **Versão**: ${{ env.APP_VERSION }}
            - **Flutter SDK**: `3.38.5` / Dart `3.x`
            - **Arquitetura**: Clean Architecture + BLoC Pattern + GetIt
            - **Cobertura de Testes**: verificada pelo job de testes da pipeline
            - **Backend / API**: Kitsu REST API & Firebase (Auth + Firestore)

            ---

            ### 🚀 Como instalar no celular:
            1. Baixe o arquivo **`Animes_IO-v${{ env.APP_VERSION }}.apk`**.
            2. Abra o arquivo no seu celular Android.
            3. Caso solicitado, ative a permissão para *"Instalar fontes desconhecidas"*.
            4. Conclua a instalação e aproveite! 🎉
          files: output_apk/Animes_IO-v${{ env.APP_VERSION }}.apk
          prerelease: false
