name: animes_io
description: App de animes em Flutter com Clean Architecture, BLoC e integração com Kitsu API.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Networking
  dio: ^5.7.0

  # Error Handling
  dartz: ^0.10.1

  # Code Generation (Models)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Cache Local
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^14.6.3

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2

  # UI
  auto_size_text: ^3.0.0
  transparent_image: ^2.0.0
  youtube_player_iframe: ^5.2.0
  flutter_inappwebview: ^6.1.5
  easy_debounce: ^2.0.3

  # Localization
  flutter_translate: ^3.1.0

  flutter_phoenix: ^1.1.0

  # Utils
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # Lint
  very_good_analysis: ^6.0.0

module:
  androidX: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/avatars/
    - assets/background/
    - assets/i18n/

  fonts:
    - family: RobotoBlack
      fonts:
        - asset: fonts/ROBOTO-BLACK.TTF
        - asset: fonts/ROBOTO-BLACKITALIC.TTF
          style: italic
    - family: RobotoBold
      fonts:
        - asset: fonts/ROBOTO-BOLD.TTF
        - asset: fonts/ROBOTO-BOLDITALIC.TTF
          style: italic
    - family: RobotoItalic
      fonts:
        - asset: fonts/ROBOTO-ITALIC.TTF
          style: italic
    - family: RobotoLight
      fonts:
        - asset: fonts/ROBOTO-LIGHT.TTF
        - asset: fonts/ROBOTO-LIGHTITALIC.TTF
          style: italic
    - family: RobotoMedium
      fonts:
        - asset: fonts/ROBOTO-MEDIUM.TTF
        - asset: fonts/ROBOTO-MEDIUMITALIC.TTF
          style: italic
    - family: RobotoRegular
      fonts:
        - asset: fonts/ROBOTO-REGULAR.TTF
    - family: RobotoThin
      fonts:
        - asset: fonts/ROBOTO-THIN.TTF
        - asset: fonts/ROBOTO-THINITALIC.TTF
          style: italic
    - family: RobotoCondensed
      fonts:
        - asset: fonts/ROBOTOCONDENSED-ITALIC.TTF
          style: italic
        - asset: fonts/ROBOTOCONDENSED-REGULAR.TTF
